<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio Link Profile | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta+ Sans', sans-serif;
            overflow-x: hidden;
            background-color: #000;
            color: #fff;
            user-select: none;
        }

        /* Glassmorphism Effect */
        .glass-card {
            background: rgba(18, 18, 24, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 255, 255, 0.03);
        }

        .glass-modal {
            background: rgba(12, 12, 16, 0.95);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        /* Glow & Animations */
        .glow-text {
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.7);
        }

        .link-btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .link-btn:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .social-icon {
            transition: all 0.3s ease;
        }
        .social-icon:hover {
            transform: translateY(-4px) scale(1.15);
            filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.8));
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
    </style>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCGHuFn0rpJKzyajLw6VEbsVaEw6JAI4YM",
            authDomain: "chat-app-7b1ff.firebaseapp.com",
            projectId: "chat-app-7b1ff",
            storageBucket: "chat-app-7b1ff.firebasestorage.app",
            messagingSenderId: "328325398180",
            appId: "1:328325398180:web:6b05703813755804983031",
            measurementId: "G-3SVCQCVW92"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const username = urlParams.get('u') || 'hiruwa';

        async function loadProfile() {
            try {
                const docRef = doc(db, "bios", username);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('profile-name').innerText = data.name || username;
                    document.getElementById('profile-bio').innerText = data.bio || "Digital Creator & Developer";
                    document.getElementById('profile-avatar').src = data.avatar || "https://i.pinimg.com/736x/8b/16/7a/8b167af653c2399dd93b952a48740620.jpg";
                    if(data.videoBg) document.getElementById('bg-video-source').src = data.videoBg;
                    if(data.music) document.getElementById('bg-audio-source').src = data.music;
                } else {
                    await setDoc(docRef, {
                        name: "Hiruwa",
                        bio: "Digital Creator & Developer",
                        avatar: "https://i.pinimg.com/736x/8b/16/7a/8b167af653c2399dd93b952a48740620.jpg",
                        videoBg: "https://assets.mixkit.co/videos/preview/mixkit-stars-in-space-1610-large.mp4",
                        music: "https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3"
                    });
                    loadProfile();
                }
            } catch (e) {
                console.error("Error loading profile:", e);
            }
        }

        window.openCustomizer = function() {
            document.getElementById('customizer-modal').classList.remove('hidden');
            document.getElementById('input-name').value = document.getElementById('profile-name').innerText;
            document.getElementById('input-bio').value = document.getElementById('profile-bio').innerText;
            document.getElementById('input-avatar').value = document.getElementById('profile-avatar').src;
        }

        window.closeCustomizer = function() {
            document.getElementById('customizer-modal').classList.add('hidden');
        }

        window.saveProfile = async function() {
            const newName = document.getElementById('input-name').value;
            const newBio = document.getElementById('input-bio').value;
            const newAvatar = document.getElementById('input-avatar').value;

            try {
                const docRef = doc(db, "bios", username);
                await updateDoc(docRef, {
                    name: newName,
                    bio: newBio,
                    avatar: newAvatar
                });
                alert("Profile successfully updated!");
                location.reload();
            } catch (e) {
                alert("Error updating profile: " + e.message);
            }
        }

        window.addEventListener('DOMContentLoaded', loadProfile);
    </script>
</head>
<body class="h-screen w-screen flex items-center justify-center relative">

    <!-- Click to Enter Screen -->
    <div id="enter-overlay" onclick="enterSite()" class="fixed inset-0 bg-black z-50 flex flex-col items-center justify-center cursor-pointer transition-all duration-700">
        <p class="text-white text-sm font-medium tracking-[0.3em] uppercase animate-pulse glow-text">Click anywhere to enter</p>
    </div>

    <!-- Background Video -->
    <video id="bg-video" loop muted playsinline class="fixed inset-0 w-full h-full object-cover opacity-35 z-0">
        <source id="bg-video-source" src="" type="video/mp4">
    </video>

    <!-- Background Audio -->
    <audio id="bg-audio" loop>
        <source id="bg-audio-source" src="" type="audio/mp3">
    </audio>

    <!-- Top Left Audio Control -->
    <button onclick="toggleAudio()" class="fixed top-6 left-6 z-20 w-11 h-11 rounded-full glass-card flex items-center justify-center text-gray-300 hover:text-white transition">
        <i id="audio-icon" class="fa-solid fa-volume-xmark text-sm"></i>
    </button>

    <!-- Bottom Right Customize Button -->
    <button onclick="openCustomizer()" class="fixed bottom-6 right-6 z-20 px-5 py-2.5 rounded-full glass-card text-xs font-semibold flex items-center space-x-2 hover:bg-white/20 transition shadow-lg">
        <i class="fa-solid fa-sliders text-emerald-400"></i> <span>Customize Profile</span>
    </button>

    <!-- Customizer Modal -->
    <div id="customizer-modal" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50 hidden p-4">
        <div class="glass-modal p-6 sm:p-8 rounded-3xl w-full max-w-md space-y-5 shadow-2xl">
            <div class="flex justify-between items-center border-b border-white/10 pb-3">
                <h3 class="text-lg font-bold glow-text">Edit Profile Dashboard</h3>
                <button onclick="closeCustomizer()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">Display Name</label>
                    <input type="text" id="input-name" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-emerald-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">Bio Description</label>
                    <input type="text" id="input-bio" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-emerald-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">Avatar Image URL</label>
                    <input type="text" id="input-avatar" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-emerald-500 transition">
                </div>
            </div>
            <div class="flex justify-end space-x-3 pt-3 border-t border-white/10">
                <button onclick="closeCustomizer()" class="px-5 py-2.5 bg-white/5 hover:bg-white/10 text-xs font-semibold rounded-xl transition">Cancel</button>
                <button onclick="saveProfile()" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-xs font-bold rounded-xl transition shadow-lg shadow-emerald-900/40">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Main Profile Card -->
    <div id="profile-card" class="glass-card z-10 w-11/12 max-w-md rounded-3xl p-8 flex flex-col items-center text-center transform scale-95 opacity-0 transition-all duration-700">
        
        <!-- Avatar -->
        <div class="relative mb-4">
            <img id="profile-avatar" src="" alt="Avatar" class="w-24 h-24 rounded-full object-cover border-2 border-white/20 shadow-2xl">
            <span class="absolute bottom-1 right-1 w-4 h-4 bg-emerald-500 border-2 border-black rounded-full shadow" title="Online"></span>
        </div>

        <!-- Name & Badge -->
        <div class="flex items-center space-x-2 mb-1">
            <h1 id="profile-name" class="text-2xl font-bold tracking-wide glow-text">Loading...</h1>
            <i class="fa-solid fa-circle-check text-blue-400 text-sm" title="Verified"></i>
        </div>

        <!-- Bio -->
        <p id="profile-bio" class="text-xs sm:text-sm text-gray-300 mb-6 font-medium">Loading...</p>

        <!-- Links Section -->
        <div class="w-full space-y-3 mb-6">
            <a href="https://discord.com" target="_blank" class="link-btn w-full py-3.5 px-4 rounded-2xl flex items-center justify-between group">
                <div class="flex items-center space-x-3">
                    <i class="fa-brands fa-discord text-indigo-400 text-lg"></i>
                    <span class="text-xs sm:text-sm font-semibold">Join My Discord Community</span>
                </div>
                <i class="fa-solid fa-arrow-right text-xs text-gray-500 group-hover:text-white group-hover:translate-x-1 transition"></i>
            </a>

            <a href="https://github.com" target="_blank" class="link-btn w-full py-3.5 px-4 rounded-2xl flex items-center justify-between group">
                <div class="flex items-center space-x-3">
                    <i class="fa-brands fa-github text-white text-lg"></i>
                    <span class="text-xs sm:text-sm font-semibold">Explore My GitHub Projects</span>
                </div>
                <i class="fa-solid fa-arrow-right text-xs text-gray-500 group-hover:text-white group-hover:translate-x-1 transition"></i>
            </a>
        </div>

        <!-- Social Icons Row -->
        <div class="flex items-center justify-center space-x-6 text-xl text-gray-300 pt-2 border-t border-white/10 w-full">
            <a href="#" class="social-icon hover:text-white"><i class="fa-brands fa-instagram"></i></a>
            <a href="#" class="social-icon hover:text-white"><i class="fa-brands fa-youtube"></i></a>
            <a href="#" class="social-icon hover:text-white"><i class="fa-brands fa-tiktok"></i></a>
            <a href="#" class="social-icon hover:text-white"><i class="fa-brands fa-spotify"></i></a>
        </div>

    </div>

    <script>
        let isPlaying = false;

        function enterSite() {
            const overlay = document.getElementById('enter-overlay');
            const card = document.getElementById('profile-card');
            const audio = document.getElementById('bg-audio');
            const video = document.getElementById('bg-video');
            const audioIcon = document.getElementById('audio-icon');

            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.display = 'none', 700);

            card.classList.remove('scale-95', 'opacity-0');
            card.classList.add('scale-100', 'opacity-100');

            audio.volume = 0.3;
            audio.play().then(() => {
                isPlaying = true;
                audioIcon.className = "fa-solid fa-volume-high text-sm text-emerald-400";
            }).catch(() => {});
            
            video.play().catch(() => {});
        }

        function toggleAudio() {
            const audio = document.getElementById('bg-audio');
            const audioIcon = document.getElementById('audio-icon');

            if (isPlaying) {
                audio.pause();
                isPlaying = false;
                audioIcon.className = "fa-solid fa-volume-xmark text-sm text-red-400";
            } else {
                audio.play();
                isPlaying = true;
                audioIcon.className = "fa-solid fa-volume-high text-sm text-emerald-400";
            }
        }
    </script>
</body>
</html>
