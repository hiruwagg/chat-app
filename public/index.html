<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiruwa | @hiruwa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; overflow: hidden; user-select: none; }
        
        /* Glassmorphism & Glow */
        .glass-card {
            background: rgba(15, 15, 20, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 255, 255, 0.05);
        }
        
        .glow-text {
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.8), 0 0 25px rgba(255, 255, 255, 0.4);
        }

        .social-icon {
            transition: all 0.3s ease;
        }
        .social-icon:hover {
            transform: translateY(-4px) scale(1.1);
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.8));
        }

        /* Typewriter Cursor */
        .cursor::after {
            content: '|';
            animation: blink 1s infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>

    <!-- Firebase SDK for Real-time Profile Views -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCGHuFn0rpJKzyajLw6VEbsVaEw6JAI4YM",
            authDomain: "chat-app-7b1ff.firebaseapp.com",
            projectId: "chat-app-7b1ff",
            storageBucket: "chat-app-7b1ff.firebasestorage.app",
            messagingSenderId: "328325398180",
            appId: "1:328325398180:web:6b05703813755804983031",
            measurementId: "G-3SVCQCVW92"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function initViews() {
            const statsRef = doc(db, "profile_stats", "hiruwa");
            try {
                const snap = await getDoc(statsRef);
                if (!snap.exists()) {
                    await setDoc(statsRef, { views: 1 });
                } else {
                    if (!sessionStorage.getItem('visited')) {
                        await updateDoc(statsRef, { views: increment(1) });
                        sessionStorage.setItem('visited', 'true');
                    }
                }
                onSnapshot(statsRef, (docSnap) => {
                    if (docSnap.exists()) {
                        document.getElementById('view-count').innerText = docSnap.data().views.toLocaleString();
                    }
                });
            } catch (e) {
                console.error("View count error:", e);
            }
        }

        window.addEventListener('DOMContentLoaded', initViews);
    </script>
</head>
<body class="bg-black text-white h-screen w-screen flex items-center justify-center relative">

    <!-- Click to Enter Overlay -->
    <div id="enter-overlay" onclick="enterSite()" class="fixed inset-0 bg-black z-50 flex flex-col items-center justify-center cursor-pointer transition-opacity duration-700">
        <p class="text-white text-lg font-semibold tracking-widest animate-pulse glow-text">click to enter...</p>
    </div>

    <!-- Background Video / Animated Wallpaper -->
    <video id="bg-video" loop muted playsinline class="fixed inset-0 w-full h-full object-cover opacity-40 z-0">
        <source src="https://assets.mixkit.co/videos/preview/mixkit-stars-in-space-1610-large.mp4" type="video/mp4">
    </video>

    <!-- Background Music -->
    <audio id="bg-audio" loop>
        <!-- ඔයාට කැමති MP3 ලින්ක් එකක් මෙතනට දාන්න පුළුවන් -->
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3" type="audio/mp3">
    </audio>

    <!-- Volume Control -->
    <button onclick="toggleMute()" class="fixed top-6 left-6 z-20 w-10 h-10 rounded-full glass-card flex items-center justify-center text-gray-300 hover:text-white transition">
        <i id="volume-icon" class="fa-solid fa-volume-high text-sm"></i>
    </button>

    <!-- Main Profile Card -->
    <div id="profile-card" class="glass-card z-10 w-11/12 max-w-md rounded-2xl p-8 flex flex-col items-center text-center transform scale-95 opacity-0 transition-all duration-700">
        
        <!-- Avatar -->
        <div class="relative mb-4">
            <img src="https://i.pinimg.com/736x/8b/16/7a/8b167af653c2399dd93b952a48740620.jpg" alt="Avatar" class="w-24 h-24 rounded-full object-cover border-2 border-white/20 shadow-lg">
            <span class="absolute bottom-1 right-1 w-4 h-4 bg-emerald-500 border-2 border-black rounded-full" title="Online"></span>
        </div>

        <!-- Username & Badges -->
        <div class="flex items-center space-x-2 mb-1">
            <h1 class="text-2xl font-extrabold tracking-wide glow-text">Hiruwa</h1>
            <i class="fa-solid fa-certificate text-blue-400 text-sm" title="Verified"></i>
            <i class="fa-solid fa-gem text-purple-400 text-sm" title="Premium"></i>
        </div>

        <!-- Typewriter Bio -->
        <p id="typewriter" class="text-sm text-gray-300 h-5 mb-4 cursor font-mono"></p>

        <!-- Location & Info -->
        <div class="flex items-center space-x-4 text-xs text-gray-400 mb-6">
            <span><i class="fa-solid fa-location-dot mr-1 text-white/70"></i> Sri Lanka</span>
            <span><i class="fa-solid fa-eye mr-1 text-white/70"></i> <span id="view-count">1</span> views</span>
        </div>

        <!-- Custom Link Buttons -->
        <div class="w-full space-y-3 mb-6">
            <a href="https://discord.com" target="_blank" class="w-full py-3 px-4 rounded-xl bg-white/5 hover:bg-white/15 border border-white/10 flex items-center justify-between transition group">
                <div class="flex items-center space-x-3">
                    <i class="fa-brands fa-discord text-indigo-400 text-xl"></i>
                    <span class="text-sm font-medium">Join My Discord</span>
                </div>
                <i class="fa-solid fa-arrow-up-right-from-square text-xs text-gray-500 group-hover:text-white transition"></i>
            </a>

            <a href="https://github.com/hiruwagg" target="_blank" class="w-full py-3 px-4 rounded-xl bg-white/5 hover:bg-white/15 border border-white/10 flex items-center justify-between transition group">
                <div class="flex items-center space-x-3">
                    <i class="fa-brands fa-github text-white text-xl"></i>
                    <span class="text-sm font-medium">My GitHub Projects</span>
                </div>
                <i class="fa-solid fa-arrow-up-right-from-square text-xs text-gray-500 group-hover:text-white transition"></i>
            </a>
        </div>

        <!-- Social Media Icons Row -->
        <div class="flex items-center justify-center space-x-6 text-2xl text-gray-300 mt-2">
            <a href="https://instagram.com" target="_blank" class="social-icon hover:text-white"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://youtube.com" target="_blank" class="social-icon hover:text-white"><i class="fa-brands fa-youtube"></i></a>
            <a href="https://tiktok.com" target="_blank" class="social-icon hover:text-white"><i class="fa-brands fa-tiktok"></i></a>
            <a href="https://open.spotify.com" target="_blank" class="social-icon hover:text-white"><i class="fa-brands fa-spotify"></i></a>
        </div>

    </div>

    <script>
        const bioTexts = ["Developer & Creator", "Welcome to my page", "Coding the future..."];
        let textIndex = 0;
        let charIndex = 0;
        let isDeleting = false;

        function typeEffect() {
            const current = bioTexts[textIndex];
            const el = document.getElementById('typewriter');
            
            if (isDeleting) {
                el.innerText = current.substring(0, charIndex--);
            } else {
                el.innerText = current.substring(0, charIndex++);
            }

            let speed = isDeleting ? 50 : 100;

            if (!isDeleting && charIndex === current.length + 1) {
                speed = 2000; // Pause at end
                isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                textIndex = (textIndex + 1) % bioTexts.length;
                speed = 500;
            }

            setTimeout(typeEffect, speed);
        }

        function enterSite() {
            const overlay = document.getElementById('enter-overlay');
            const card = document.getElementById('profile-card');
            const audio = document.getElementById('bg-audio');
            const video = document.getElementById('bg-video');

            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.display = 'none', 700);

            card.classList.remove('scale-95', 'opacity-0');
            card.classList.add('scale-100', 'opacity-100');

            audio.volume = 0.4;
            audio.play().catch(() => {});
            video.play().catch(() => {});
            typeEffect();
        }

        function toggleMute() {
            const audio = document.getElementById('bg-audio');
            const icon = document.getElementById('volume-icon');
            audio.muted = !audio.muted;
            icon.className = audio.muted ? "fa-solid fa-volume-xmark text-sm text-red-400" : "fa-solid fa-volume-high text-sm";
        }
    </script>
</body>
</html>
