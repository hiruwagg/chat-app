<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Chat with Firebase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, updateDoc, onSnapshot, query, orderBy, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Your Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCGHuFn0rpJKzyajLw6VEbsVaEw6JAI4YM",
            authDomain: "chat-app-7b1ff.firebaseapp.com",
            projectId: "chat-app-7b1ff",
            storageBucket: "chat-app-7b1ff.firebasestorage.app",
            messagingSenderId: "328325398180",
            appId: "1:328325398180:web:6b05703813755804983031",
            measurementId: "G-3SVCQCVW92"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentUser = null;
        let mediaRecorder, audioChunks = [], isRecording = false;

        window.onload = function() {
            const rememberedUser = localStorage.getItem('chat_remembered_user') || sessionStorage.getItem('chat_session_user');
            if (rememberedUser) {
                currentUser = rememberedUser;
                startChatApp();
            }
        };

        window.toggleAuthMode = function() {
            const isSignUp = document.getElementById('auth-btn').innerText === "Login";
            document.getElementById('auth-title').innerText = isSignUp ? "Create Account" : "Login to Chat";
            document.getElementById('auth-btn').innerText = isSignUp ? "Sign Up" : "Login";
            document.getElementById('auth-switch-text').innerText = isSignUp ? "Already have an account?" : "Don't have an account?";
            document.getElementById('auth-switch-btn').innerText = isSignUp ? "Login" : "Sign Up";
            document.getElementById('auth-error').classList.add('hidden');
        };

        window.handleAuth = async function() {
            const username = document.getElementById('auth-username').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            const rememberMe = document.getElementById('remember-me').checked;
            const errorDiv = document.getElementById('auth-error');
            const isSignUp = document.getElementById('auth-btn').innerText === "Sign Up";

            if (!username || !password) {
                errorDiv.innerText = "Please fill in all fields.";
                errorDiv.classList.remove('hidden');
                return;
            }

            try {
                const userRef = doc(db, "users", username);
                const userSnap = await getDoc(userRef);

                if (isSignUp) {
                    if (userSnap.exists()) {
                        errorDiv.innerText = "Username already exists!";
                        errorDiv.classList.remove('hidden');
                        return;
                    }
                    await setDoc(userRef, { password: password });
                } else {
                    if (!userSnap.exists() || userSnap.data().password !== password) {
                        errorDiv.innerText = "Invalid username or password!";
                        errorDiv.classList.remove('hidden');
                        return;
                    }
                }

                currentUser = username;
                if (rememberMe) localStorage.setItem('chat_remembered_user', username);
                else sessionStorage.setItem('chat_session_user', username);
                startChatApp();
            } catch (err) {
                errorDiv.innerText = "Error: " + err.message;
                errorDiv.classList.remove('hidden');
            }
        };

        function startChatApp() {
            document.getElementById('auth-container').classList.add('hidden');
            document.getElementById('chat-app').classList.remove('hidden');
            document.getElementById('current-username').innerText = currentUser;
            document.getElementById('user-avatar').innerText = currentUser.charAt(0).toUpperCase();
            listenMessages();
        }

        window.logout = function() {
            localStorage.removeItem('chat_remembered_user');
            sessionStorage.removeItem('chat_session_user');
            location.reload();
        };

        // Real-time listener using Firebase Firestore
        function listenMessages() {
            const q = query(collection(db, "messages"), orderBy("timestamp", "asc"));
            onSnapshot(q, (snapshot) => {
                const container = document.getElementById('chat-messages');
                container.innerHTML = '';
                
                snapshot.forEach((documentSnapshot) => {
                    const msg = documentSnapshot.data();
                    const docId = documentSnapshot.id;
                    const isMe = msg.user === currentUser;
                    const div = document.createElement('div');
                    div.className = `max-w-[70%] rounded-lg p-3 text-sm flex flex-col relative group ${isMe ? 'self-end bg-[#dcf8c6]' : 'self-start bg-white'}`;
                    
                    let contentHTML = '';
                    if (msg.deleted) {
                        contentHTML = `<span class="text-gray-400 italic text-xs"><i class="fa-solid fa-ban mr-1"></i> This message was deleted</span>`;
                    } else if (msg.type === 'image') {
                        contentHTML = `<img src="${msg.data}" class="rounded-lg max-h-48 object-cover mb-1 cursor-pointer" onclick="window.open('${msg.data}')">`;
                    } else if (msg.type === 'audio') {
                        contentHTML = `<audio controls class="w-64 mb-1"><source src="${msg.data}" type="audio/webm"></audio>`;
                    } else {
                        contentHTML = `<span class="text-gray-800 break-words">${msg.text}</span>`;
                    }

                    let deleteBtnHTML = isMe && !msg.deleted ? `<button onclick="deleteMessage('${docId}')" class="absolute top-1 right-2 text-gray-400 hover:text-red-600 opacity-0 group-hover:opacity-100 transition"><i class="fa-solid fa-trash text-xs"></i></button>` : '';

                    div.innerHTML = `
                        <div class="flex justify-between items-center mb-1"><span class="text-xs font-bold text-emerald-700">${msg.user}</span>${deleteBtnHTML}</div>
                        ${contentHTML}
                        <span class="text-[10px] text-gray-400 self-end mt-1">${new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                    `;
                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;
            });
        }

        window.sendTextMessage = async function() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;
            await addDoc(collection(db, "messages"), {
                user: currentUser,
                type: 'text',
                text: text,
                timestamp: Date.now(),
                deleted: false
            });
            input.value = '';
        };

        window.handleFileSelect = async function(event, type) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                await addDoc(collection(db, "messages"), {
                    user: currentUser,
                    type: type,
                    data: e.target.result,
                    timestamp: Date.now(),
                    deleted: false
                });
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        };

        window.deleteMessage = async function(docId) {
            if (!confirm("Delete for everyone?")) return;
            const msgRef = doc(db, "messages", docId);
            await updateDoc(msgRef, {
                deleted: true,
                text: '',
                data: ''
            });
        };

        window.toggleVoiceRecording = async function() {
            const micIcon = document.getElementById('mic-icon');
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = async () => {
                        const blob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onload = async function(e) {
                            await addDoc(collection(db, "messages"), {
                                user: currentUser,
                                type: 'audio',
                                data: e.target.result,
                                timestamp: Date.now(),
                                deleted: false
                            });
                        };
                        reader.readAsDataURL(blob);
                    };
                    mediaRecorder.start();
                    isRecording = true;
                    micIcon.classList.remove('fa-microphone');
                    micIcon.classList.add('fa-stop', 'text-red-600');
                } catch (e) { alert("Mic permission denied."); }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                micIcon.classList.remove('fa-stop', 'text-red-600');
                micIcon.classList.add('fa-microphone');
            }
        };

        document.getElementById('message-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendTextMessage();
        });
    </script>
</head>
<body class="bg-[#f0f2f5] h-screen flex flex-col justify-center items-center">

    <!-- Auth Modal -->
    <div id="auth-container" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-96">
            <h2 id="auth-title" class="text-2xl font-bold text-emerald-600 mb-6 text-center">Login to Chat</h2>
            <div id="auth-error" class="text-red-500 text-sm mb-4 hidden text-center"></div>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <input type="text" id="auth-username" class="w-full px-3 py-2 border rounded-lg outline-none focus:border-emerald-600" placeholder="Enter username">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="auth-password" class="w-full px-3 py-2 border rounded-lg outline-none focus:border-emerald-600" placeholder="Enter password">
                </div>
                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center">
                        <input type="checkbox" id="remember-me" class="mr-2 rounded text-emerald-600"> Remember login
                    </label>
                </div>
                <button id="auth-btn" onclick="handleAuth()" class="w-full bg-emerald-600 text-white py-2 rounded-lg font-semibold hover:bg-emerald-700 transition">Login</button>
                <p class="text-center text-sm text-gray-600 mt-4">
                    <span id="auth-switch-text">Don't have an account?</span> 
                    <button onclick="toggleAuthMode()" class="text-emerald-600 font-semibold hover:underline ml-1" id="auth-switch-btn">Sign Up</button>
                </p>
            </div>
        </div>
    </div>

    <!-- Main Chat UI -->
    <div id="chat-app" class="w-full max-w-5xl h-[90vh] bg-white shadow-lg flex overflow-hidden rounded-lg hidden">
        <div class="w-1/3 border-r border-gray-200 flex flex-col bg-white">
            <div class="bg-[#f0f2f5] px-4 py-3 flex justify-between items-center border-b">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-full bg-emerald-600 text-white flex items-center justify-center font-bold" id="user-avatar">U</div>
                    <span class="font-medium text-gray-700" id="current-username">Loading...</span>
                </div>
                <button onclick="logout()" class="text-gray-500 hover:text-red-600" title="Logout"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
            <div class="p-3 bg-white border-b">
                <div class="bg-[#f0f2f5] flex items-center px-3 py-1.5 rounded-lg">
                    <i class="fa-solid fa-magnifying-glass text-gray-400 mr-3"></i>
                    <input type="text" placeholder="Search chat" class="bg-transparent w-full text-sm outline-none">
                </div>
            </div>
            <div class="overflow-y-auto flex-1">
                <div class="flex items-center px-4 py-3 bg-[#f0f2f5] border-b">
                    <div class="w-12 h-12 rounded-full bg-emerald-500 text-white flex items-center justify-center font-bold text-lg mr-3">G</div>
                    <div>
                        <h4 class="font-medium text-gray-900">Firebase Real-time Chat</h4>
                        <p class="text-xs text-emerald-600 font-semibold">Lightning Fast Sync</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="w-2/3 flex flex-col bg-[#efeae2]">
            <div class="bg-[#f0f2f5] px-4 py-3 flex justify-between items-center border-b">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-full bg-emerald-500 text-white flex items-center justify-center font-bold">G</div>
                    <div>
                        <h3 class="font-medium text-gray-900">Firebase Real-time Chat</h3>
                        <p class="text-xs text-emerald-600 font-semibold">Online</p>
                    </div>
                </div>
            </div>

            <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3 flex flex-col"></div>

            <div class="bg-[#f0f2f5] px-4 py-3 flex items-center space-x-3 relative">
                <input type="file" id="image-input" accept="image/*" class="hidden" onchange="handleFileSelect(event, 'image')">
                <input type="file" id="audio-input" accept="audio/*" class="hidden" onchange="handleFileSelect(event, 'audio')">

                <button onclick="document.getElementById('image-input').click()" class="text-gray-500 hover:text-emerald-600 transition"><i class="fa-solid fa-image text-lg"></i></button>
                <button onclick="document.getElementById('audio-input').click()" class="text-gray-500 hover:text-emerald-600 transition mr-1"><i class="fa-solid fa-file-audio text-lg"></i></button>

                <input type="text" id="message-input" placeholder="Type a message" class="flex-1 bg-white px-4 py-2 rounded-lg text-sm outline-none">

                <button id="mic-btn" onclick="toggleVoiceRecording()" class="text-gray-500 hover:text-red-600 transition"><i class="fa-solid fa-microphone text-lg" id="mic-icon"></i></button>
                <button onclick="sendTextMessage()" class="bg-emerald-600 text-white w-10 h-10 rounded-full flex items-center justify-center hover:bg-emerald-700 transition"><i class="fa-solid fa-paper-plane text-sm"></i></button>
            </div>
        </div>
    </div>
</body>
</html>
