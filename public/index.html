<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio Link Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; user-select: none; }
        .glass-card {
            background: rgba(15, 15, 20, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
        }
        .glow-text { text-shadow: 0 0 12px rgba(255, 255, 255, 0.8); }
        .social-icon { transition: all 0.3s ease; }
        .social-icon:hover { transform: translateY(-4px) scale(1.1); }
    </style>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCGHuFn0rpJKzyajLw6VEbsVaEw6JAI4YM",
            authDomain: "chat-app-7b1ff.firebaseapp.com",
            projectId: "chat-app-7b1ff",
            storageBucket: "chat-app-7b1ff.firebasestorage.app",
            messagingSenderId: "328325398180",
            appId: "1:328325398180:web:6b05703813755804983031",
            measurementId: "G-3SVCQCVW92"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // URL එකෙන් username එක ලබා ගැනීම (ഉदा: index.html?u=hiruwa)
        const urlParams = new URLSearchParams(window.location.search);
        const username = urlParams.get('u') || 'hiruwa';

        async function loadProfile() {
            try {
                const docRef = doc(db, "bios", username);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('profile-name').innerText = data.name || username;
                    document.getElementById('profile-bio').innerText = data.bio || "Welcome to my bio page";
                    document.getElementById('profile-avatar').src = data.avatar || "https://i.pinimg.com/736x/8b/16/7a/8b167af653c2399dd93b952a48740620.jpg";
                    if(data.videoBg) document.getElementById('bg-video-source').src = data.videoBg;
                    if(data.music) document.getElementById('bg-audio-source').src = data.music;
                } else {
                    // Default profile create if not exists
                    await setDoc(docRef, {
                        name: "Hiruwa",
                        bio: "Developer & Creator",
                        avatar: "https://i.pinimg.com/736x/8b/16/7a/8b167af653c2399dd93b952a48740620.jpg",
                        videoBg: "https://assets.mixkit.co/videos/preview/mixkit-stars-in-space-1610-large.mp4",
                        music: "https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3"
                    });
                }
            } catch (e) {
                console.error("Error loading profile:", e);
            }
        }

        window.openCustomizer = function() {
            document.getElementById('customizer-modal').classList.remove('hidden');
            // Fill current values
            document.getElementById('input-name').value = document.getElementById('profile-name').innerText;
            document.getElementById('input-bio').value = document.getElementById('profile-bio').innerText;
            document.getElementById('input-avatar').value = document.getElementById('profile-avatar').src;
        }

        window.closeCustomizer = function() {
            document.getElementById('customizer-modal').classList.add('hidden');
        }

        window.saveProfile = async function() {
            const newName = document.getElementById('input-name').value;
            const newBio = document.getElementById('input-bio').value;
            const newAvatar = document.getElementById('input-avatar').value;

            try {
                const docRef = doc(db, "bios", username);
                await updateDoc(docRef, {
                    name: newName,
                    bio: newBio,
                    avatar: newAvatar
                });
                alert("Profile updated successfully!");
                location.reload();
            } catch (e) {
                alert("Error updating: " + e.message);
            }
        }

        window.addEventListener('DOMContentLoaded', loadProfile);
    </script>
</head>
<body class="bg-black text-white h-screen w-screen flex items-center justify-center relative">

    <!-- Click to Enter Overlay -->
    <div id="enter-overlay" onclick="enterSite()" class="fixed inset-0 bg-black z-50 flex flex-col items-center justify-center cursor-pointer transition-opacity duration-700">
        <p class="text-white text-lg font-semibold tracking-widest animate-pulse glow-text">click to enter...</p>
    </div>

    <!-- Background Video -->
    <video id="bg-video" loop muted playsinline class="fixed inset-0 w-full h-full object-cover opacity-40 z-0">
        <source id="bg-video-source" src="https://assets.mixkit.co/videos/preview/mixkit-stars-in-space-1610-large.mp4" type="video/mp4">
    </video>

    <!-- Background Music -->
    <audio id="bg-audio" loop>
        <source id="bg-audio-source" src="" type="audio/mp3">
    </audio>

    <!-- Customize Button (Bottom Right) -->
    <button onclick="openCustomizer()" class="fixed bottom-6 right-6 z-20 px-4 py-2 rounded-full glass-card text-xs font-semibold flex items-center space-x-2 hover:bg-white/20 transition">
        <i class="fa-solid fa-pen-to-square"></i> <span>Customize Profile</span>
    </button>

    <!-- Customizer Modal -->
    <div id="customizer-modal" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50 hidden">
        <div class="glass-card p-6 rounded-2xl w-96 space-y-4">
            <h3 class="text-lg font-bold glow-text">Edit Your Profile</h3>
            <div>
                <label class="block text-xs text-gray-400 mb-1">Display Name</label>
                <input type="text" id="input-name" class="w-full bg-white/10 border border-white/20 rounded-lg px-3 py-2 text-sm outline-none focus:border-white">
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-1">Bio Text</label>
                <input type="text" id="input-bio" class="w-full bg-white/10 border border-white/20 rounded-lg px-3 py-2 text-sm outline-none focus:border-white">
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-1">Avatar Image URL</label>
                <input type="text" id="input-avatar" class="w-full bg-white/10 border border-white/20 rounded-lg px-3 py-2 text-sm outline-none focus:border-white">
            </div>
            <div class="flex justify-end space-x-2 pt-2">
                <button onclick="closeCustomizer()" class="px-4 py-2 bg-gray-700 text-xs rounded-lg hover:bg-gray-600">Cancel</button>
                <button onclick="saveProfile()" class="px-4 py-2 bg-emerald-600 text-xs font-bold rounded-lg hover:bg-emerald-500">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Main Profile Card -->
    <div id="profile-card" class="glass-card z-10 w-11/12 max-w-md rounded-2xl p-8 flex flex-col items-center text-center transform scale-95 opacity-0 transition-all duration-700">
        
        <!-- Avatar -->
        <div class="relative mb-4">
            <img id="profile-avatar" src="" alt="Avatar" class="w-24 h-24 rounded-full object-cover border-2 border-white/20 shadow-lg">
            <span class="absolute bottom-1 right-1 w-4 h-4 bg-emerald-500 border-2 border-black rounded-full"></span>
        </div>

        <!-- Name & Badges -->
        <div class="flex items-center space-x-2 mb-1">
            <h1 id="profile-name" class="text-2xl font-extrabold tracking-wide glow-text">Loading...</h1>
            <i class="fa-solid fa-certificate text-blue-400 text-sm"></i>
        </div>

        <!-- Bio -->
        <p id="profile-bio" class="text-sm text-gray-300 mb-6 font-mono">Loading...</p>

        <!-- Links -->
        <div class="w-full space-y-3 mb-6">
            <a href="https://discord.com" target="_blank" class="w-full py-3 px-4 rounded-xl bg-white/5 hover:bg-white/15 border border-white/10 flex items-center justify-between transition group">
                <div class="flex items-center space-x-3">
                    <i class="fa-brands fa-discord text-indigo-400 text-xl"></i>
                    <span class="text-sm font-medium">Join My Discord</span>
                </div>
                <i class="fa-solid fa-arrow-up-right-from-square text-xs text-gray-500 group-hover:text-white transition"></i>
            </a>
        </div>

        <!-- Social Icons -->
        <div class="flex items-center justify-center space-x-6 text-2xl text-gray-300 mt-2">
            <a href="#" class="social-icon hover:text-white"><i class="fa-brands fa-instagram"></i></a>
            <a href="#" class="social-icon hover:text-white"><i class="fa-brands fa-github"></i></a>
            <a href="#" class="social-icon hover:text-white"><i class="fa-brands fa-tiktok"></i></a>
        </div>
    </div>

    <script>
        function enterSite() {
            const overlay = document.getElementById('enter-overlay');
            const card = document.getElementById('profile-card');
            const audio = document.getElementById('bg-audio');
            const video = document.getElementById('bg-video');

            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.display = 'none', 700);

            card.classList.remove('scale-95', 'opacity-0');
            card.classList.add('scale-100', 'opacity-100');

            audio.volume = 0.4;
            audio.play().catch(() => {});
            video.play().catch(() => {});
        }
    </script>
</body>
</html>
