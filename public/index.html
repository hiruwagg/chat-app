        const app = initializeApp(firebaseConfig);

        let currentUser = null;

        let currentChatType = "group"; // 'group' or 'private'

        window.onload = function() {
            const rememberedUser = localStorage.getItem('chat_remembered_user');
            const rememberedPass = localStorage.getItem('chat_remembered_pass');
            const sessionUser = sessionStorage.getItem('chat_session_user');
            const sessionPass = sessionStorage.getItem('chat_session_pass');

            if (rememberedUser && rememberedPass) {
                currentUser = rememberedUser;
                currentPassword = rememberedPass;
                startChatApp();
            } else if (sessionUser && sessionPass) {
                currentUser = sessionUser;
                currentPassword = sessionPass;
                startChatApp();
            }
        };

        window.toggleAuthMode = function() {
            const isSignUp = document.getElementById('auth-btn').innerText === "Login";
            document.getElementById('auth-title').innerText = isSignUp ? "Create Account" : "Login to Chat";
            document.getElementById('auth-btn').innerText = isSignUp ? "Sign Up" : "Login";
            document.getElementById('auth-switch-text').innerText = isSignUp ? "Already have an account?" : "Don't have an account?";
            document.getElementById('auth-switch-btn').innerText = isSignUp ? "Login" : "Sign Up";
            document.getElementById('auth-error').classList.add('hidden');
        };

        window.handleAuth = async function() {
            const username = document.getElementById('auth-username').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            const rememberMe = document.getElementById('remember-me').checked;
            const errorDiv = document.getElementById('auth-error');
            const isSignUp = document.getElementById('auth-btn').innerText === "Sign Up";

            if (!username || !password) {
                errorDiv.innerText = "Please fill in all fields.";
                errorDiv.classList.remove('hidden');
                return;
            }

            try {
                const userRef = doc(db, "users", username);
                const userSnap = await getDoc(userRef);

                if (isSignUp) {
                    if (userSnap.exists()) {
                        errorDiv.innerText = "Username already exists!";
                        errorDiv.classList.remove('hidden');
                        return;
                    }
                    await setDoc(userRef, { password: password, username: username });
                } else {
                    if (!userSnap.exists() || userSnap.data().password !== password) {
                        errorDiv.innerText = "Invalid username or password!";
                        errorDiv.classList.remove('hidden');
                        return;
                    }
                }

                currentUser = username;
                currentPassword = password;
                if (rememberMe) {
                    localStorage.setItem('chat_remembered_user', username);
                    localStorage.setItem('chat_remembered_pass', password);
                } else {
                    sessionStorage.setItem('chat_session_user', username);
                    sessionStorage.setItem('chat_session_pass', password);
                }
                startChatApp();
            } catch (err) {
                errorDiv.innerText = "Error: " + err.message;
                errorDiv.classList.remove('hidden');
            }
        };

        function startChatApp() {
            document.getElementById('auth-container').classList.add('hidden');
            document.getElementById('chat-app').classList.remove('hidden');
            document.getElementById('current-username').innerText = currentUser;
            document.getElementById('user-avatar').innerText = currentUser.charAt(0).toUpperCase();
            loadSidebarLists();
            switchChat('global_room', 'Global Public Group', 'group');
        }
