<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Chat with Netlify DB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#f0f2f5] h-screen flex flex-col justify-center items-center">
    <div class="w-full max-w-5xl h-[90vh] bg-white shadow-lg flex overflow-hidden rounded-lg">
        <!-- Sidebar -->
        <div class="w-1/3 border-r border-gray-200 flex flex-col bg-white">
            <div class="bg-[#f0f2f5] px-4 py-3 flex justify-between items-center border-b">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-full bg-gray-300 flex items-center justify-center font-bold text-gray-600" id="user-avatar">U</div>
                    <span class="font-medium text-gray-700" id="current-username">Loading...</span>
                </div>
            </div>
            <div class="p-3 bg-white border-b">
                <div class="bg-[#f0f2f5] flex items-center px-3 py-1.5 rounded-lg">
                    <i class="fa-solid fa-magnifying-glass text-gray-400 mr-3"></i>
                    <input type="text" placeholder="Search chat" class="bg-transparent w-full text-sm outline-none">
                </div>
            </div>
            <div class="overflow-y-auto flex-1">
                <div class="flex items-center px-4 py-3 bg-[#f0f2f5] border-b">
                    <div class="w-12 h-12 rounded-full bg-emerald-500 text-white flex items-center justify-center font-bold text-lg mr-3">G</div>
                    <div>
                        <h4 class="font-medium text-gray-900">Netlify Global Chat</h4>
                        <p class="text-xs text-gray-500">Live database chat</p>
                    </div>
                </div>
            </div>
        </div>
        <!-- Chat Area -->
        <div class="w-2/3 flex flex-col bg-[#efeae2]">
            <div class="bg-[#f0f2f5] px-4 py-3 flex justify-between items-center border-b">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-full bg-emerald-500 text-white flex items-center justify-center font-bold">G</div>
                    <div>
                        <h3 class="font-medium text-gray-900">Netlify Global Chat</h3>
                        <p class="text-xs text-emerald-600 font-semibold">Online (Netlify Database Connected)</p>
                    </div>
                </div>
            </div>
            <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3 flex flex-col"></div>
            <div class="bg-[#f0f2f5] px-4 py-3 flex items-center space-x-3">
                <input type="text" id="message-input" placeholder="Type a message" class="flex-1 bg-white px-4 py-2 rounded-lg text-sm outline-none">
                <button onclick="sendMessage()" class="bg-emerald-600 text-white w-10 h-10 rounded-full flex items-center justify-center hover:bg-emerald-700 transition">
                    <i class="fa-solid fa-paper-plane text-sm"></i>
                </button>
            </div>
        </div>
    </div>
    <script>
        const username = prompt("Enter your chat handle:") || "User_" + Math.floor(Math.random() * 1000);
        document.getElementById('current-username').innerText = username;
        document.getElementById('user-avatar').innerText = username.charAt(0).toUpperCase();

        async function fetchMessages() {
            try {
                const res = await fetch('/.netlify/functions/messages');
                const messages = await res.json();
                const container = document.getElementById('chat-messages');
                container.innerHTML = '';
                messages.forEach(msg => {
                    const isMe = msg.user === username;
                    const div = document.createElement('div');
                    div.className = `max-w-[70%] rounded-lg p-3 text-sm flex flex-col ${isMe ? 'self-end bg-[#dcf8c6]' : 'self-start bg-white'}`;
                    div.innerHTML = `
                        <span class="text-xs font-bold text-emerald-700 mb-1">${msg.user}</span>
                        <span class="text-gray-800 break-words">${msg.text}</span>
                        <span class="text-[10px] text-gray-400 self-end mt-1">${new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                    `;
                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;
            } catch (err) {
                console.error("Failed to load messages", err);
            }
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;
            await fetch('/.netlify/functions/messages', {
                method: 'POST',
                body: JSON.stringify({ user: username, text: text, timestamp: Date.now() })
            });
            input.value = '';
            fetchMessages();
        }

        document.getElementById('message-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        setInterval(fetchMessages, 3000);
        fetchMessages();
    </script>
</body>
</html>
